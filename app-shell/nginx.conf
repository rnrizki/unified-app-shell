server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for minimal bundle transfer (< 30 KB)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers (Tier 1: Edge Layer)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://user-shell-app.lmrei.id https://user-shell-login.lmrei.id https://*.lmrei.id http://localhost:*;" always;

    # Health check endpoint
    location = /health {
        default_type application/json;
        return 200 '{"status":"UP","container":"user-shell-app","version":"1.0.0"}';
    }

    # Declarative Registry Manifest
    location = /app-registry.json {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Reverse Proxy subpath for SSO Auth Bridge API
    location /api/auth/ {
        proxy_pass http://login:8000/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy Subpath: /edu
    location /edu/ {
        alias /usr/share/nginx/html/apps/edu/;
        try_files $uri $uri/ /apps/edu/index.html;
    }

    # Reverse Proxy Subpath: /ops
    location /ops/ {
        alias /usr/share/nginx/html/apps/ops/;
        try_files $uri $uri/ /apps/ops/index.html;
    }

    # Static Assets & Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
